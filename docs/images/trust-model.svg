<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#7d8590"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#f85149"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#0d1117"/>
  <text x="34" y="46" fill="#e6edf3" font-size="21" font-weight="600">What a request passes through</text>
  <text x="34" y="70" fill="#7d8590" font-size="13">Every gate below is enforced in code. None of them is a sentence in a prompt asking nicely.</text>

  <!-- lane 1: who -->
  <rect x="34" y="98" width="196" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="122" fill="#7d8590" font-size="11" letter-spacing="1.4">WHO IS ASKING</text>
  <rect x="50" y="134" width="164" height="26" rx="5" fill="#1f6feb" opacity=".18"/>
  <text x="60" y="152" fill="#79c0ff" font-size="13">owner — you</text>
  <rect x="50" y="164" width="164" height="26" rx="5" fill="#3fb950" opacity=".14"/>
  <text x="60" y="182" fill="#7ee787" font-size="13">trusted — a role</text>
  <rect x="50" y="194" width="164" height="26" rx="5" fill="#d29922" opacity=".16"/>
  <text x="60" y="212" fill="#e3b341" font-size="13">ask — a role</text>
  <rect x="50" y="224" width="164" height="14" rx="4" fill="#f85149" opacity=".14"/>
  <text x="60" y="235" fill="#ff7b72" font-size="11">blocked — the default</text>

  <!-- lane 2: limits -->
  <rect x="266" y="98" width="196" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="282" y="122" fill="#7d8590" font-size="11" letter-spacing="1.4">LIMITS — FIRST</text>
  <text x="282" y="146" fill="#c9d1d9" font-size="12.5">daily cap, per person</text>
  <text x="282" y="166" fill="#c9d1d9" font-size="12.5">global cap, everyone</text>
  <text x="282" y="186" fill="#c9d1d9" font-size="12.5">cooldown starts on ask</text>
  <text x="282" y="206" fill="#c9d1d9" font-size="12.5">one open request each</text>
  <text x="282" y="232" fill="#7d8590" font-size="11">counted before approval, so</text>
  <text x="282" y="245" fill="#7d8590" font-size="11">denials cannot be spammed</text>

  <!-- lane 3: approval -->
  <rect x="498" y="98" width="196" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="514" y="122" fill="#7d8590" font-size="11" letter-spacing="1.4">YOUR APPROVAL</text>
  <text x="514" y="146" fill="#c9d1d9" font-size="12.5">DM with the full prompt</text>
  <text x="514" y="170" fill="#7ee787" font-size="12.5">Allow · Once · Never</text>
  <text x="514" y="196" fill="#7d8590" font-size="11">the third button exists so a</text>
  <text x="514" y="209" fill="#7d8590" font-size="11">persistent stranger cannot</text>
  <text x="514" y="222" fill="#7d8590" font-size="11">become a permanent DM feed</text>
  <text x="514" y="243" fill="#e3b341" font-size="11">covers the text, not the person</text>

  <!-- lane 4: model -->
  <rect x="730" y="98" width="136" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="746" y="122" fill="#7d8590" font-size="11" letter-spacing="1.4">MODEL</text>
  <text x="746" y="148" fill="#79c0ff" font-size="12.5">you → the best</text>
  <text x="746" y="172" fill="#7d8590" font-size="12.5">others → cheapest</text>
  <text x="746" y="204" fill="#7d8590" font-size="11">sessions end after</text>
  <text x="746" y="217" fill="#7d8590" font-size="11">an hour of silence:</text>
  <text x="746" y="230" fill="#7d8590" font-size="11">resuming replays the</text>
  <text x="746" y="243" fill="#7d8590" font-size="11">whole thing, billed</text>

  <line x1="230" y1="173" x2="262" y2="173" stroke="#7d8590" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="462" y1="173" x2="494" y2="173" stroke="#7d8590" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="694" y1="173" x2="726" y2="173" stroke="#7d8590" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- the split -->
  <text x="34" y="300" fill="#e6edf3" font-size="16" font-weight="600">Then it runs — in one of two rooms</text>

  <rect x="34" y="318" width="404" height="176" rx="8" fill="#161b22" stroke="#1f6feb"/>
  <text x="52" y="344" fill="#79c0ff" font-size="14" font-weight="600">You</text>
  <text x="52" y="368" fill="#c9d1d9" font-size="12.5">full power, unsandboxed, no prompt</text>
  <text x="52" y="390" fill="#c9d1d9" font-size="12.5">may read your files, run commands,</text>
  <text x="52" y="410" fill="#c9d1d9" font-size="12.5">speak into any channel, run the server</text>
  <rect x="52" y="424" width="368" height="52" rx="6" fill="#f85149" opacity=".10"/>
  <text x="64" y="444" fill="#ff7b72" font-size="12" font-weight="600">except what cannot be undone</text>
  <text x="64" y="463" fill="#c9d1d9" font-size="11.5">deleting a channel or role, purging — proposed, then a button</text>

  <rect x="462" y="318" width="404" height="176" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="480" y="344" fill="#7ee787" font-size="14" font-weight="600">Everybody else</text>
  <text x="480" y="368" fill="#c9d1d9" font-size="12.5">a fresh empty folder, and nothing else</text>
  <rect x="480" y="382" width="368" height="94" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="492" y="402" fill="#7d8590" font-size="11.5" font-family="ui-monospace,Consolas,monospace">cwd + --add-dir   the job folder only</text>
  <text x="492" y="422" fill="#ff7b72" font-size="11.5" font-family="ui-monospace,Consolas,monospace">--disallowedTools Bash, NotebookEdit</text>
  <text x="492" y="442" fill="#7ee787" font-size="11.5" font-family="ui-monospace,Consolas,monospace">--allowedTools    Read Write Edit Glob</text>
  <text x="492" y="460" fill="#7ee787" font-size="11.5" font-family="ui-monospace,Consolas,monospace">                  Grep WebSearch WebFetch</text>

  <line x1="596" y1="252" x2="596" y2="314" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="236" y1="252" x2="236" y2="314" stroke="#1f6feb" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- footer -->
  <rect x="34" y="516" width="832" height="72" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="542" fill="#e6edf3" font-size="13" font-weight="600">An approved prompt is still sandboxed.</text>
  <text x="52" y="564" fill="#c9d1d9" font-size="12.5">Saying "this text is fine" is not saying "this person may run commands on my PC" — so approval never</text>
  <text x="52" y="580" fill="#c9d1d9" font-size="12.5">moves anyone out of the right-hand room. The sandbox is the guarantee; the prompt rules are only manners.</text>
</svg>
